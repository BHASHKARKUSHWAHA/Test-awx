# AI proxy: serves AWX plus the AI Agent on one NodePort, and injects the
# "AI Agent" entry point into the AWX dashboard.
#
# The agent backend itself runs as a systemd service on the host (see
# installer/ai.py). That is deliberate: Linux tools must observe the real host
# - its processes, services, memory and journal - not a container's namespaced
# view of them. The proxy reaches it over the node IP.
#
# Placeholders are substituted by installer/ai.py.
---
apiVersion: v1
kind: Service
metadata:
  name: awx-ai-proxy
  namespace: ${AWX_NAMESPACE}
  labels:
    app.kubernetes.io/name: awx-ai-proxy
    app.kubernetes.io/part-of: smart-awx-ai
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: awx-ai-proxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: ${PROXY_NODEPORT}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: awx-ai-proxy
  namespace: ${AWX_NAMESPACE}
  labels:
    app.kubernetes.io/name: awx-ai-proxy
    app.kubernetes.io/part-of: smart-awx-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: awx-ai-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: awx-ai-proxy
      annotations:
        smart-awx-ai/config-hash: "${CONFIG_HASH}"
    spec:
      containers:
        - name: nginx
          image: ${PROXY_IMAGE}
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ai-agent-inject.js
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: config
              mountPath: /etc/nginx/ai/inject.js
              subPath: inject.js
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: config
          configMap:
            name: awx-ai-proxy-config
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
