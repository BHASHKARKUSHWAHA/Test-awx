# AI proxy in front of AWX.
#
# Why a proxy at all: AWX ships a compiled React SPA. Rebuilding that image to
# add a menu item would have to be redone on every AWX upgrade, and a mistake
# there breaks AWX itself. Injecting one script tag at the edge leaves the AWX
# container byte-for-byte untouched, survives AWX upgrades, and degrades to a
# floating launcher button if a future AWX release changes its nav markup.
#
# Rendered by installer/ai.py: ${HOST_IP}, ${AGENT_PORT}, ${AWX_SERVICE},
# ${AWX_SERVICE_PORT} are substituted at install time.

upstream ai_agent_backend {
    server ${HOST_IP}:${AGENT_PORT};
    keepalive 8;
}

upstream awx_backend {
    server ${AWX_SERVICE}:${AWX_SERVICE_PORT};
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 50m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # ---- the script injected into the AWX dashboard --------------------
    location = /ai-agent-inject.js {
        alias /etc/nginx/ai/inject.js;
        add_header Cache-Control "no-cache";
        default_type application/javascript;
    }

    # ---- AI Agent UI ----------------------------------------------------
    location /ai-agent/ {
        proxy_pass http://ai_agent_backend/ai-agent/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- AI Agent API (SSE: buffering must stay off) ---------------------
    location /api/ai/ {
        proxy_pass http://ai_agent_backend/api/ai/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- AI Agent health (used by the installer and the UI) -------------
    location = /ai-health {
        proxy_pass http://ai_agent_backend/health;
        proxy_set_header Host $host;
    }

    # ---- everything else is AWX, untouched except for one script tag ----
    location / {
        proxy_pass http://awx_backend;
        proxy_http_version 1.1;

        # sub_filter cannot rewrite a compressed response.
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AWX uses websockets for live job output.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # text/html is always filtered; listing it again only warns.
        sub_filter_once on;
        sub_filter '</body>' '<script src="/ai-agent-inject.js" defer></script></body>';
    }
}
