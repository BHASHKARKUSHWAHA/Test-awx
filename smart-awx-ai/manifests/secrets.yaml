# Credential template for the AI Agent (spec section 34).
#
# Nothing in this repository contains a real credential. The installer renders
# this template with values it generated or read from the AWX operator's own
# secret, applies it, and writes the same values to /etc/smart-awx-ai/agent.env
# with mode 0600 (root only) for the systemd unit to source.
#
# Rotating the AWX password:
#   kubectl -n awx create secret generic smart-awx-ai-credentials \
#     --from-literal=AWX_USERNAME=admin \
#     --from-literal=AWX_PASSWORD='<new password>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#   sudo python3 install.py --repair
---
apiVersion: v1
kind: Secret
metadata:
  name: smart-awx-ai-credentials
  namespace: ${AWX_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: smart-awx-ai
type: Opaque
stringData:
  AWX_URL: "${AWX_URL}"
  AWX_USERNAME: "${AWX_USERNAME}"
  AWX_PASSWORD: "${AWX_PASSWORD}"
  AGENT_SESSION_SECRET: "${AGENT_SESSION_SECRET}"
  AGENT_LOCAL_USER: "${AGENT_LOCAL_USER}"
  AGENT_LOCAL_PASSWORD_HASH: "${AGENT_LOCAL_PASSWORD_HASH}"
